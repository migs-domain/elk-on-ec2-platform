##############################################################################
# Logstash Pipeline: WAF Logs
# Source: S3 bucket (delivered by Kinesis Data Firehose; JSON format)
##############################################################################
input {
  s3 {
    bucket       => "${WAF_LOGS_BUCKET}"
    prefix       => "waf/"
    region       => "${AWS_REGION}"
    sqs_queue    => "${WAF_SQS_QUEUE}"
    codec        => "json_lines"
    sincedb_path => "/var/lib/logstash/sincedb/waf"
    type         => "waf"
  }
}

filter {
  if [type] == "waf" {
    # WAF v2 log format is a flat JSON object per line
    date {
      match => ["timestamp", "UNIX_MS"]
      target => "@timestamp"
    }

    # Parse HTTP request details
    if [httpRequest] {
      mutate {
        rename => {
          "[httpRequest][clientIp]"      => "[source][ip]"
          "[httpRequest][country]"       => "[source][geo][country_iso_code]"
          "[httpRequest][uri]"           => "[url][path]"
          "[httpRequest][args]"          => "[url][query]"
          "[httpRequest][httpMethod]"    => "[http][request][method]"
          "[httpRequest][requestId]"     => "[http][request][id]"
          "[httpRequest][httpVersion]"   => "[http][version]"
        }
      }
    }

    # GeoIP
    if [source][ip] {
      geoip {
        source => "[source][ip]"
        target => "geoip"
      }
    }

    # ECS normalization
    mutate {
      rename => {
        "action"     => "[event][action]"
        "webAclId"   => "[waf][web_acl_id]"
        "terminatingRuleId"   => "[waf][terminating_rule_id]"
        "terminatingRuleType" => "[waf][terminating_rule_type]"
        "ruleGroupList"       => "[waf][rule_groups]"
      }
      add_field => {
        "[event][dataset]"  => "aws.waf"
        "[event][module]"   => "aws"
        "[cloud][provider]" => "aws"
      }
      remove_field => ["message", "host", "httpRequest"]
    }
  }
}

output {
  if [type] == "waf" {
    elasticsearch {
      hosts    => ["${ES_HOSTS}"]
      index    => "logs-aws.waf-%{+YYYY.MM.dd}"
      user     => "${ES_LOGSTASH_USER}"
      password => "${ES_LOGSTASH_PASSWORD}"
      ssl      => true
      ssl_certificate_verification => true
      cacert   => "/etc/logstash/certs/ca.crt"
      keystore => "/etc/logstash/certs/logstash.p12"
      keystore_password => "${LOGSTASH_KEYSTORE_PASS}"
      ilm_enabled        => true
      ilm_rollover_alias => "logs-aws.waf"
      ilm_pattern        => "{now/d}-000001"
      ilm_policy         => "logs-aws-ilm-policy"
      manage_template    => false
    }
  }
}
