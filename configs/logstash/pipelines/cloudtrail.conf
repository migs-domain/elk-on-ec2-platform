##############################################################################
# Logstash Pipeline: CloudTrail Logs
# Source: S3 bucket (JSON compressed with gzip)
##############################################################################
input {
  s3 {
    bucket       => "${CLOUDTRAIL_BUCKET}"
    prefix       => "cloudtrail/AWSLogs/"
    region       => "${AWS_REGION}"
    sqs_queue    => "${CLOUDTRAIL_SQS_QUEUE}"
    codec        => "json_lines"
    sincedb_path => "/var/lib/logstash/sincedb/cloudtrail"
    type         => "cloudtrail"
  }
}

filter {
  if [type] == "cloudtrail" {
    # CloudTrail delivers a JSON file with a "Records" array
    split {
      field => "Records"
    }

    # Promote the record fields
    if [Records] {
      ruby {
        code => "
          record = event.get('Records')
          record.each do |k, v|
            event.set(k, v)
          end
          event.remove('Records')
        "
      }
    }

    # Parse event time
    date {
      match => ["eventTime", "ISO8601"]
      target => "@timestamp"
    }

    # GeoIP on source IP
    if [sourceIPAddress] and [sourceIPAddress] !~ /amazonaws\.com/ {
      geoip {
        source => "sourceIPAddress"
        target => "source_geo"
      }
    }

    # ECS normalization
    mutate {
      rename => {
        "sourceIPAddress"    => "[source][ip]"
        "userAgent"          => "[user_agent][original]"
        "eventName"          => "[event][action]"
        "eventSource"        => "[event][provider]"
        "awsRegion"          => "[cloud][region]"
        "requestID"          => "[event][id]"
        "userIdentity"       => "[user][identity]"
        "requestParameters"  => "[cloudtrail][request_parameters]"
        "responseElements"   => "[cloudtrail][response_elements]"
        "errorCode"          => "[error][code]"
        "errorMessage"       => "[error][message]"
      }
      add_field => {
        "[event][dataset]"  => "aws.cloudtrail"
        "[event][module]"   => "aws"
        "[cloud][provider]" => "aws"
      }
      remove_field => ["message", "host"]
    }
  }
}

output {
  if [type] == "cloudtrail" {
    elasticsearch {
      hosts    => ["${ES_HOSTS}"]
      index    => "logs-aws.cloudtrail-%{+YYYY.MM.dd}"
      user     => "${ES_LOGSTASH_USER}"
      password => "${ES_LOGSTASH_PASSWORD}"
      ssl      => true
      ssl_certificate_verification => true
      cacert   => "/etc/logstash/certs/ca.crt"
      keystore => "/etc/logstash/certs/logstash.p12"
      keystore_password => "${LOGSTASH_KEYSTORE_PASS}"
      ilm_enabled        => true
      ilm_rollover_alias => "logs-aws.cloudtrail"
      ilm_pattern        => "{now/d}-000001"
      ilm_policy         => "logs-aws-ilm-policy"
      manage_template    => false
    }
  }
}
