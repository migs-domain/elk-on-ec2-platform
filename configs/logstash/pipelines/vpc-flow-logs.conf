##############################################################################
# Logstash Pipeline: VPC Flow Logs
# Source: S3 bucket (via SQS notification or polling)
# Format: space-delimited VPC Flow Log v5 fields
##############################################################################
input {
  s3 {
    bucket       => "${VPC_FLOW_LOGS_BUCKET}"
    prefix       => "vpc-flow-logs/"
    region       => "${AWS_REGION}"
    sqs_queue    => "${VPC_FLOW_SQS_QUEUE}"
    codec        => "plain"
    sincedb_path => "/var/lib/logstash/sincedb/vpc-flow"
    type         => "vpc_flow"
  }
}

filter {
  if [type] == "vpc_flow" {
    # Skip header line
    if [message] =~ /^version/ {
      drop {}
    }

    # VPC Flow Log v5 default fields
    # version account-id interface-id srcaddr dstaddr srcport dstport protocol packets bytes start end action log-status
    dissect {
      mapping => {
        "message" => "%{version} %{account_id} %{interface_id} %{srcaddr} %{dstaddr} %{srcport} %{dstport} %{protocol} %{packets} %{bytes} %{start} %{end} %{action} %{log_status}"
      }
    }

    # Parse timestamps
    date {
      match => ["start", "UNIX"]
      target => "@timestamp"
    }

    # Type conversions
    mutate {
      convert => {
        "srcport"  => "integer"
        "dstport"  => "integer"
        "protocol" => "integer"
        "packets"  => "integer"
        "bytes"    => "integer"
        "start"    => "integer"
        "end"      => "integer"
      }
    }

    # GeoIP on source address (skip RFC1918)
    if [srcaddr] and [srcaddr] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)/ {
      geoip {
        source => "srcaddr"
        target => "source_geo"
      }
    }

    # Map protocol number to name
    translate {
      field       => "protocol"
      destination => "protocol_name"
      dictionary  => {
        "1"  => "ICMP"
        "6"  => "TCP"
        "17" => "UDP"
        "50" => "ESP"
        "51" => "AH"
      }
      fallback => "UNKNOWN"
    }

    # ECS normalization
    mutate {
      rename => {
        "srcaddr"  => "[source][ip]"
        "srcport"  => "[source][port]"
        "dstaddr"  => "[destination][ip]"
        "dstport"  => "[destination][port]"
        "bytes"    => "[network][bytes]"
        "packets"  => "[network][packets]"
        "action"   => "[event][action]"
        "account_id" => "[cloud][account][id]"
      }
      add_field => {
        "[event][dataset]"   => "aws.vpcflow"
        "[event][module]"    => "aws"
        "[cloud][provider]"  => "aws"
      }
      remove_field => ["message", "host", "version"]
    }
  }
}

output {
  if [type] == "vpc_flow" {
    elasticsearch {
      hosts    => ["${ES_HOSTS}"]
      index    => "logs-aws.vpcflow-%{+YYYY.MM.dd}"
      user     => "${ES_LOGSTASH_USER}"
      password => "${ES_LOGSTASH_PASSWORD}"
      ssl      => true
      ssl_certificate_verification => true
      cacert   => "/etc/logstash/certs/ca.crt"
      keystore => "/etc/logstash/certs/logstash.p12"
      keystore_password => "${LOGSTASH_KEYSTORE_PASS}"
      ilm_enabled        => true
      ilm_rollover_alias => "logs-aws.vpcflow"
      ilm_pattern        => "{now/d}-000001"
      ilm_policy         => "logs-aws-ilm-policy"
      manage_template    => false
    }
  }
}
