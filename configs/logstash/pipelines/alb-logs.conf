##############################################################################
# Logstash Pipeline: ALB Access Logs
# Source: S3 bucket with ALB log prefix
# Input: logstash-input-s3 (polling via SQS notifications)
##############################################################################
input {
  s3 {
    bucket     => "${ALB_LOGS_BUCKET}"
    prefix     => "alb/"
    region     => "${AWS_REGION}"
    # SQS notification queue for event-driven ingestion (preferred over polling)
    sqs_queue  => "${ALB_SQS_QUEUE}"
    # Codec handles uncompressed text; ALB logs are plain text
    codec      => "plain"
    sincedb_path => "/var/lib/logstash/sincedb/alb-access"
    type       => "alb_access"
    # mTLS to verify Logstash identity to ES is handled on output
  }
}

filter {
  if [type] == "alb_access" {
    # ALB log format: space-delimited (not quite syslog, not quite CSV)
    dissect {
      mapping => {
        "message" => "%{type} %{timestamp} %{elb} %{client_ip}:%{client_port} %{target_ip}:%{target_port} %{request_processing_time} %{target_processing_time} %{response_processing_time} %{elb_status_code} %{target_status_code} %{received_bytes} %{sent_bytes} \"%{request}\" \"%{user_agent}\" %{ssl_cipher} %{ssl_protocol} %{target_group_arn} \"%{trace_id}\" \"%{domain_name}\" \"%{chosen_cert_arn}\" %{matched_rule_priority} %{request_creation_time} \"%{actions_executed}\" \"%{redirect_url}\" \"%{error_reason}\" \"%{target_port_list}\" \"%{target_status_code_list}\" \"%{classification}\" \"%{classification_reason}\""
      }
    }

    # Parse request line
    dissect {
      mapping => {
        "request" => "%{http_method} %{url} %{http_version}"
      }
    }

    # Parse timestamp
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }

    # GeoIP on client IP
    if [client_ip] and [client_ip] != "-" {
      geoip {
        source => "client_ip"
        target => "geoip"
      }
    }

    # User agent parsing
    if [user_agent] and [user_agent] != "-" {
      useragent {
        source => "user_agent"
        target => "ua"
      }
    }

    # Type conversions
    mutate {
      convert => {
        "request_processing_time"  => "float"
        "target_processing_time"   => "float"
        "response_processing_time" => "float"
        "received_bytes"           => "integer"
        "sent_bytes"               => "integer"
        "elb_status_code"          => "integer"
        "target_status_code"       => "integer"
        "client_port"              => "integer"
        "target_port"              => "integer"
      }
    }

    # ECS normalization
    mutate {
      rename => {
        "client_ip"   => "[source][ip]"
        "client_port" => "[source][port]"
        "target_ip"   => "[destination][ip]"
        "target_port" => "[destination][port]"
        "http_method" => "[http][request][method]"
        "url"         => "[url][original]"
        "elb_status_code" => "[http][response][status_code]"
        "sent_bytes"  => "[http][response][bytes]"
        "received_bytes" => "[http][request][bytes]"
        "user_agent"  => "[user_agent][original]"
        "ssl_protocol" => "[tls][version]"
      }
      add_field => {
        "[event][dataset]" => "aws.alb"
        "[event][module]"  => "aws"
        "[cloud][provider]" => "aws"
      }
      remove_field => ["message", "host"]
    }
  }
}

output {
  if [type] == "alb_access" {
    elasticsearch {
      hosts    => ["${ES_HOSTS}"]
      index    => "logs-aws.alb-%{+YYYY.MM.dd}"
      user     => "${ES_LOGSTASH_USER}"
      password => "${ES_LOGSTASH_PASSWORD}"
      ssl      => true
      ssl_certificate_verification => true
      cacert   => "/etc/logstash/certs/ca.crt"
      # mTLS — Logstash client cert
      keystore => "/etc/logstash/certs/logstash.p12"
      keystore_password => "${LOGSTASH_KEYSTORE_PASS}"
      ilm_enabled     => true
      ilm_rollover_alias => "logs-aws.alb"
      ilm_pattern        => "{now/d}-000001"
      ilm_policy         => "logs-aws-ilm-policy"
      manage_template => false
    }
  }
}
