##############################################################################
# Filebeat configuration — App EC2 hosts (Nginx + System logs → ES)
# Located at: /etc/filebeat/filebeat.yml
##############################################################################

filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: true
  reload.period: 30s

# ── Inputs ────────────────────────────────────────────────────────────────────
filebeat.inputs:

# System logs (via module — see modules.d/system.yml)
- type: filestream
  id: system-syslog
  enabled: false  # managed by module

# Nginx logs (via module — see modules.d/nginx.yml)
- type: filestream
  id: nginx-access-direct
  enabled: false  # managed by module

# JVM GC logs from Elasticsearch (if this host also runs ES)
- type: filestream
  id: es-gc-logs
  enabled: false
  paths:
    - /var/log/elasticsearch/gc.log*
  tags: ["elasticsearch", "gc", "jvm"]
  fields:
    event.dataset: elasticsearch.gc
    event.module: elasticsearch
  fields_under_root: true

##############################################################################
# Processors (global — apply to all events)
##############################################################################
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
  - add_process_metadata:
      match_pids: [process.pid, process.parent.pid]
  - timestamp:
      field: "@timestamp"
      layouts:
        - '2006-01-02T15:04:05.999Z07:00'
        - '2006-01-02T15:04:05Z'
      test:
        - '2024-01-15T10:30:00Z'

##############################################################################
# Output — Elasticsearch (mTLS)
##############################################################################
output.elasticsearch:
  hosts: ["${ES_HOSTS}"]
  protocol: "https"
  username: "${ES_FILEBEAT_USER}"
  password: "${ES_FILEBEAT_PASSWORD}"
  # TLS settings
  ssl.enabled: true
  ssl.certificate_authorities: ["/etc/filebeat/certs/ca.crt"]
  # mTLS
  ssl.certificate: "/etc/filebeat/certs/filebeat.crt"
  ssl.key: "/etc/filebeat/certs/filebeat.key"
  ssl.verification_mode: "certificate"
  # Index lifecycle management
  ilm.enabled: true
  ilm.policy_name: "logs-filebeat-ilm-policy"
  ilm.rollover_alias: "filebeat"
  # Bulk settings
  bulk_max_size: 2048
  worker: 4
  compression_level: 3

##############################################################################
# Internal queue
##############################################################################
queue.mem:
  events: 8192
  flush.min_events: 2048
  flush.timeout: 5s

##############################################################################
# Monitoring (report to Kibana / use Metricbeat instead)
##############################################################################
monitoring:
  enabled: false  # Use Metricbeat module instead

##############################################################################
# Logging
##############################################################################
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat.log
  keepfiles: 7
  permissions: 0640

##############################################################################
# Setup (run once with `filebeat setup`)
##############################################################################
setup.kibana:
  host: "https://${KIBANA_HOST}:5601"
  ssl.certificate_authorities: ["/etc/filebeat/certs/ca.crt"]
  ssl.certificate: "/etc/filebeat/certs/filebeat.crt"
  ssl.key: "/etc/filebeat/certs/filebeat.key"

setup.ilm.enabled: true
setup.dashboards.enabled: false  # managed separately via NDJSON
