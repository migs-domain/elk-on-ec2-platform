##############################################################################
# Fluent Bit configuration: App EC2 host
# Tails JSON application logs and forwards to Elasticsearch ingest nodes
# with full mTLS authentication.
# Located at: /etc/fluent-bit/fluent-bit.conf
##############################################################################

[SERVICE]
    # Flush interval (seconds)
    Flush         5
    # Log level
    Log_Level     info
    Log_File      /var/log/fluent-bit/fluent-bit.log
    # Daemon mode (managed by systemd)
    Daemon        Off
    # Parsers configuration
    Parsers_File  parsers.conf
    # HTTP server for Prometheus metrics scraping
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    # Storage (buffering) settings
    storage.path              /var/lib/fluent-bit/buffer
    storage.sync              normal
    storage.checksum          off
    storage.max_chunks_up     128
    storage.backlog.mem_limit 50M

##############################################################################
# INPUTS
##############################################################################

# ── App JSON logs ─────────────────────────────────────────────────────────────
[INPUT]
    Name              tail
    Path              /var/log/app/*.log
    Path_Key          log_file
    Tag               app.json
    Parser            json
    DB                /var/lib/fluent-bit/db/app-json.db
    Mem_Buf_Limit     32MB
    Read_from_Head    False
    Rotate_Wait       30
    Refresh_Interval  10
    Skip_Long_Lines   On

# ── Nginx access logs ─────────────────────────────────────────────────────────
[INPUT]
    Name              tail
    Path              /var/log/nginx/access.log
    Tag               nginx.access
    Parser            nginx_combined
    DB                /var/lib/fluent-bit/db/nginx-access.db
    Mem_Buf_Limit     16MB
    Read_from_Head    False

# ── Nginx error logs ──────────────────────────────────────────────────────────
[INPUT]
    Name              tail
    Path              /var/log/nginx/error.log
    Tag               nginx.error
    Parser            nginx_error
    DB                /var/lib/fluent-bit/db/nginx-error.db
    Mem_Buf_Limit     8MB
    Read_from_Head    False

# ── systemd journal (service logs) ───────────────────────────────────────────
[INPUT]
    Name              systemd
    Tag               systemd.*
    Systemd_Filter    _SYSTEMD_UNIT=nginx.service
    Systemd_Filter    _SYSTEMD_UNIT=app.service
    Read_From_Tail    On
    Strip_Underscores On

##############################################################################
# FILTERS
##############################################################################

# ── Add host metadata ─────────────────────────────────────────────────────────
[FILTER]
    Name    record_modifier
    Match   *
    Record  host.name ${HOSTNAME}
    Record  cloud.provider aws
    Record  cloud.region ${AWS_REGION}
    Record  environment ${ENVIRONMENT}
    Record  node_role app-host

# ── ECS normalization for app logs ────────────────────────────────────────────
[FILTER]
    Name    nest
    Match   app.json
    Operation lift
    Nested_under message
    Add_prefix  app.

# ── Add event.dataset field ───────────────────────────────────────────────────
[FILTER]
    Name    modify
    Match   app.*
    Add     event.dataset app.json

[FILTER]
    Name    modify
    Match   nginx.*
    Add     event.dataset nginx.access
    Add     event.module  nginx

# ── Deduplicate / drop noisy records ─────────────────────────────────────────
[FILTER]
    Name    grep
    Match   nginx.access
    Exclude url /health

##############################################################################
# OUTPUTS
##############################################################################

# ── Elasticsearch with mTLS ───────────────────────────────────────────────────
[OUTPUT]
    Name              es
    Match             *
    Host              ${ES_INGEST_HOST}
    Port              9200
    HTTP_User         ${ES_FLUENTD_USER}
    HTTP_Passwd       ${ES_FLUENTD_PASSWORD}
    # TLS settings
    tls               On
    tls.verify        On
    tls.ca_file       /etc/fluent-bit/certs/ca.crt
    # mTLS — Fluentd client certificate
    tls.crt_file      /etc/fluent-bit/certs/fluentd.crt
    tls.key_file      /etc/fluent-bit/certs/fluentd.key
    # Index naming
    Index             logs-app-%Y.%m.%d
    # Suppress timestamp field conflict
    Suppress_Type_Name On
    # Write pipeline (ECS ingest pipeline on ES side)
    Pipeline          logs-app-pipeline
    # Retry
    Retry_Limit       5
    # Buffer to disk to handle ES downtime
    storage.type      filesystem
